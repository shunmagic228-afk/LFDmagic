<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>光球</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stage"></canvas>
<div id="exitIndicator" class="hidden"></div>
<div id="primeScreen">
  <div class="primeText">
    ご使用前に画面をタップしてください
    <span class="primeSub">モーションセンサーの使用許可ダイアログが表示されるので「許可」を選んでください。以降はこの表示は出ません。</span>
  </div>
</div>
<div id="settingsScreen" class="hidden">
  <h1>設定</h1>
  <div class="settingsLabel">アイテムをタップしてから退場するまでの時間</div>
  <div class="durationGrid" id="exitDelayGrid"></div>
  <button class="closeBtn" id="closeSettingsBtn">閉じる</button>
</div>
<script src="js/main.js"></script>
</body>
</html>
